<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treino 3D — HIIT com Indicador de Pedalada</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body, html { width:100%; height:100%; overflow:hidden; background:#000; color:#fff; }

        #canvas-container { width:100vw; height:100vh; position:absolute; top:0; left:0; z-index:1; }

        .tag-cenario { 
            position:absolute; top:8px; left:8px; 
            background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:10px; 
            font-size:0.65rem; color:#81C784; z-index:2; pointer-events:none;
        }

        /* INDICADORES DE PEDALADA (ESQUERDA E DIREITA) */
        .indicador-pedal {
            position: absolute; top: 40%; transform: translateY(-50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 70px; height: 110px; background: rgba(0,0,0,0.75);
            border: 2px solid #555; border-radius: 12px; z-index: 4;
            backdrop-filter: blur(4px); transition: all 0.2s ease;
        }
        .indicador-pedal.esquerdo { left: 15px; }
        .indicador-pedal.direito { right: 15px; }

        .pedal-label { font-size: 0.6rem; font-weight: bold; color: #aaa; text-transform: uppercase; margin-bottom: 4px; }
        .pedal-seta { font-size: 2.2rem; transition: transform 0.15s ease, color 0.15s ease; }
        .pedal-status { font-size: 0.65rem; font-weight: bold; margin-top: 2px; }

        /* ESTADOS DOS PEDAIS */
        .pedal-em-cima { border-color: #2196F3; box-shadow: 0 0 12px rgba(33, 150, 243, 0.6); }
        .pedal-em-cima .pedal-seta { color: #2196F3; transform: translateY(-6px); }
        .pedal-em-cima .pedal-status { color: #2196F3; }

        .pedal-em-baixo { border-color: #555; opacity: 0.6; }
        .pedal-em-baixo .pedal-seta { color: #777; transform: translateY(6px); }
        .pedal-em-baixo .pedal-status { color: #777; }

        /* HUD DO TREINADOR VIRTUAL */
        .hud-treinador {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 480px; background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2196F3; border-radius: 10px; padding: 10px 14px;
            z-index: 3; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            transition: border-color 0.5s;
        }
        .treinador-avatar { font-size: 2rem; }
        .treinador-info { display: flex; flex-direction: column; }
        .treinador-nome { font-size: 0.65rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .treinador-fala { font-size: 0.85rem; font-weight: bold; color: #fff; }

        .painel-controle { 
            position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
            width:90%; max-width:420px; background:rgba(10, 10, 12, 0.85); 
            border-radius:12px; padding:10px 14px; border:2px solid #2196F3; 
            z-index:2; backdrop-filter:blur(6px); display:flex; flex-direction:column; gap:8px;
            transition: border-color 0.5s ease;
        }

        .secao-label { font-size:0.6rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; }

        .opcoes-tempo { display:flex; gap:4px; overflow-x:auto; padding-bottom:2px; }
        .opcoes-tempo::-webkit-scrollbar { display:none; }

        .botao-tempo { 
            padding:4px 10px; font-size:0.7rem; font-weight:bold; 
            border:1px solid #333; border-radius:4px; background:rgba(0,0,0,0.6); 
            color:#ccc; cursor:pointer; white-space:nowrap; transition:all 0.3s;
        }

        .botao-tempo.selecionado { border-color:#fff; background:rgba(255,255,255,0.2); color:#fff; }

        .indicador-faixa {
            font-size: 0.75rem; font-weight: bold; text-align: center;
            padding: 4px; border-radius: 4px; background: rgba(255,255,255,0.1);
        }

        .dados-treino { display:flex; justify-content:space-between; text-align:center; background:rgba(0,0,0,0.4); padding:6px 8px; border-radius:6px; }
        .dado { flex:1; }
        .dado span { font-size:0.85rem; font-weight:bold; color:#2196F3; font-family:monospace; transition:color 0.5s; }
        .dado label { font-size:0.55rem; color:#888; display:block; }

        .tempo-restante { font-size:1.2rem; font-weight:bold; color:#2196F3; font-family:monospace; text-align:center; transition:color 0.5s; }
        .barra-progresso { width:100%; height:5px; background:#222; border-radius:3px; overflow:hidden; }
        .progresso { height:100%; background:#2196F3; width:0%; transition:width 0.3s, background-color 0.5s; }

        .botoes-acao { display:flex; gap:6px; justify-content:center; }
        .btn { padding:6px 12px; font-size:0.7rem; font-weight:bold; border:none; border-radius:4px; cursor:pointer; }
        .btn.iniciar { background:#4CAF50; color:white; }
        .btn.parar { background:#f44336; color:white; }
        .btn.reiniciar { background:#ff9800; color:white; }
        .btn.tela-cheia { background:#2196F3; color:white; }
        .btn:disabled { opacity:0.3; cursor:not-allowed; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="tag-cenario" id="nomeCenario">⚡ Cyber HIIT — Guia Visceral de Cadência de Pedais</div>
    </div>

    <!-- PAINÉIS DE SETAS DOS PÉS -->
    <div class="indicador-pedal esquerdo" id="pedalEsq">
        <div class="pedal-label">Pé Esq.</div>
        <div class="pedal-seta" id="setaEsq">⬆</div>
        <div class="pedal-status" id="statusEsq">SUBINDO</div>
    </div>

    <div class="indicador-pedal direito" id="pedalDir">
        <div class="pedal-label">Pé Dir.</div>
        <div class="pedal-seta" id="setaDir">⬇</div>
        <div class="pedal-status" id="statusDir">DESCENDO</div>
    </div>

    <!-- PAINEL DO TREINADOR -->
    <div class="hud-treinador" id="hudTreinador">
        <div class="treinador-avatar">🚴‍♂️</div>
        <div class="treinador-info">
            <div class="treinador-nome">Coach HIIT Virtual</div>
            <div class="treinador-fala" id="falaTreinador">Siga as setas dos lados para manter o ritmo correto dos pés!</div>
        </div>
    </div>

    <div class="painel-controle" id="painelControle">
        <div class="secao-label">Duração Total:</div>
        <div class="opcoes-tempo">
            <button class="botao-tempo" data-segundos="300">5m</button>
            <button class="botao-tempo" data-segundos="600">10m</button>
            <button class="botao-tempo" data-segundos="900">15m</button>
            <button class="botao-tempo" data-segundos="1200">20m</button>
            <button class="botao-tempo" data-segundos="1800">30m</button>
        </div>

        <div class="indicador-faixa" id="indicadorFaixa">Faixa Atual: Z1 Aquecimento</div>

        <div class="dados-treino">
            <div class="dado"><span id="cal">0</span><label>Kcal</label></div>
            <div class="dado"><span id="km">0.00</span><label>Km</label></div>
            <div class="dado"><span id="vel">18.0</span><label>Km/h</label></div>
            <div class="dado"><span id="rpm">65</span><label>RPM</label></div>
        </div>

        <div class="tempo-restante" id="tempo">00:00:00</div>
        <div class="barra-progresso"><div class="progresso" id="barra"></div></div>

        <div class="botoes-acao">
            <button class="btn iniciar" id="btnIniciar" disabled>Iniciar HIIT</button>
            <button class="btn parar" id="btnParar" disabled>Pausar</button>
            <button class="btn reiniciar" id="btnReiniciar" disabled>Reiniciar</button>
            <button class="btn tela-cheia" id="btnTela">Tela Cheia</button>
        </div>
    </div>

    <script>
        /* ESTRUTURA DO TREINO HIIT */
        const cicloHIIT = [
            { zona: 'z1', duracao: 60, fala: "Aquecimento na Z1. Mantenha o ritmo visual dos pedais!" },
            { zona: 'z4', duracao: 30, fala: "TIRO Z4! Acompanhe as setas acelerando!" },
            { zona: 'z2', duracao: 60, fala: "Recuperação Z2. Mantenha o fluxo suave." },
            { zona: 'z3', duracao: 30, fala: "ACELERA! Acompanhe o balanço do guidão e as setas!" },
            { zona: 'z1', duracao: 60, fala: "Respire fundo na Z1 e prepare-se." },
            { zona: 'z4', duracao: 30, fala: "FORÇA TOTAL Z4! Siga o ritmo até o fim!" }
        ];

        const zonas = {
            z1: { nome: "Z1 Aquecimento / Recuperação", xPos: -3.0, vel: 18.0, rpm: 65, cor: "#2196F3", hex: 0x2196F3 },
            z2: { nome: "Z2 Recuperação Ativa",          xPos: -1.0, vel: 25.0, rpm: 80, cor: "#4CAF50", hex: 0x4CAF50 },
            z3: { nome: "Z3 Limiar HIIT",                xPos:  1.0, vel: 34.0, rpm: 100, cor: "#FF9800", hex: 0xFF9800 },
            z4: { nome: "Z4 SPRINT HIIT",                xPos:  3.0, vel: 45.0, rpm: 120, cor: "#F44336", hex: 0xF44336 }
        };

        function falarTreinador(texto) {
            document.getElementById('falaTreinador').textContent = texto;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(texto);
                fala.lang = 'pt-BR';
                fala.rate = 1.0;
                window.speechSynthesis.speak(fala);
            }
        }

        /* THREE.JS SETUP */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(zonas.z1.xPos, 1.25, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const headlight = new THREE.SpotLight(0xffffff, 3, 45, Math.PI / 4, 0.5);
        headlight.position.set(0, 1.0, -0.2);
        headlight.target.position.set(0, 0, -20);
        scene.add(headlight); scene.add(headlight.target);

        /* POV GUIDÃO */
        const povGroup = new THREE.Group();
        scene.add(povGroup);
        povGroup.position.x = zonas.z1.xPos;

        const matHandle = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
        const matGrip = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });

        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3), matHandle);
        stem.rotation.x = Math.PI / 3; stem.position.set(0, 0.85, -0.4); povGroup.add(stem);

        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.7), matHandle);
        bar.rotation.z = Math.PI / 2; bar.position.set(0, 0.95, -0.5); povGroup.add(bar);

        const gripL = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);
        gripL.rotation.z = Math.PI / 2; gripL.position.set(0.3, 0.95, -0.5); povGroup.add(gripL);

        const gripR = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);
        gripR.rotation.z = Math.PI / 2; gripR.position.set(-0.3, 0.95, -0.5); povGroup.add(gripR);

        const displayMat = new THREE.MeshBasicMaterial({ color: zonas.z1.hex });
        const display = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.02), displayMat);
        display.position.set(0, 1.0, -0.48); display.rotation.x = -Math.PI / 6; povGroup.add(display);

        /* PISTA E FAIXAS DE RITMO MULTIPLAS */
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.8 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 200), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -90); scene.add(road);

        Object.keys(zonas).forEach(k => {
            const z = zonas[k];
            const faixaMat = new THREE.MeshBasicMaterial({ color: z.hex });
            const faixa = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 200), faixaMat);
            faixa.rotation.x = -Math.PI / 2;
            faixa.position.set(z.xPos, 0.005, -90);
            scene.add(faixa);
        });

        const trackLines = [];
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const divisorX = [-2.0, 0.0, 2.0];
        
        for (let i = 0; i < 20; i++) {
            divisorX.forEach(posX => {
                const line = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.01, 2), lineMat);
                line.position.set(posX, 0.01, -i * 10); 
                scene.add(line); 
                trackLines.push(line);
            });
        }

        /* CHUVA 3D */
        const QTD_GOTAS = 400;
        const rainGeo = new THREE.BufferGeometry();
        const rainPositions = new Float32Array(QTD_GOTAS * 6);
        const COMPRIMENTO_GOTA = 0.4;

        for (let i = 0; i < QTD_GOTAS; i++) {
            const x = (Math.random() - 0.5) * 16;
            const y = Math.random() * 8;
            const z = -Math.random() * 30;

            rainPositions[i * 6] = x;
            rainPositions[i * 6 + 1] = y;
            rainPositions[i * 6 + 2] = z;

            rainPositions[i * 6 + 3] = x;
            rainPositions[i * 6 + 4] = y - COMPRIMENTO_GOTA;
            rainPositions[i * 6 + 5] = z;
        }

        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
        const rainMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.65 });
        const rainSystem = new THREE.LineSegments(rainGeo, rainMat);
        scene.add(rainSystem);

        let velocidadeChuvaY = -0.08;

        /* ELEMENTOS HUD E CONTROLE */
        const botoesTempo = document.querySelectorAll('.botao-tempo');
        const painelControle = document.getElementById('painelControle');
        const hudTreinador = document.getElementById('hudTreinador');
        const indicadorFaixa = document.getElementById('indicadorFaixa');
        const tempoEl = document.getElementById('tempo');
        const btnIniciar = document.getElementById('btnIniciar');
        const btnParar = document.getElementById('btnParar');
        const btnReiniciar = document.getElementById('btnReiniciar');
        const btnTela = document.getElementById('btnTela');
        const barra = document.getElementById('barra');
        const elCal = document.getElementById('cal');
        const elKm = document.getElementById('km');
        const elVel = document.getElementById('vel');
        const elRpm = document.getElementById('rpm');

        /* ELEMENTOS DAS SETAS DOS PÉS */
        const pedalEsq = document.getElementById('pedalEsq');
        const pedalDir = document.getElementById('pedalDir');
        const setaEsq = document.getElementById('setaEsq');
        const setaDir = document.getElementById('setaDir');
        const statusEsq = document.getElementById('statusEsq');
        const statusDir = document.getElementById('statusDir');

        let tempoTotal = 0, tempoRestante = 0;
        let cronometro = null, treinoAtivo = false;
        let calorias = 0, distancia = 0;
        
        let indiceEtapaHIIT = 0;
        let tempoSegundosEtapa = 0;
        let zonaChaveAtual = 'z1';
        let xAlvoCamera = zonas.z1.xPos;

        botoesTempo.forEach(btn => {
            btn.addEventListener('click', () => {
                botoesTempo.forEach(b => b.classList.remove('selecionado'));
                btn.classList.add('selecionado');
                tempoTotal = parseInt(btn.dataset.segundos);
                tempoRestante = tempoTotal;
                atualizaTela();
                btnIniciar.disabled = false;
            });
        });

        function aplicarEtapaHIIT(etapaIndex) {
            const etapa = cicloHIIT[etapaIndex];
            zonaChaveAtual = etapa.zona;
            tempoSegundosEtapa = 0;
            
            const z = zonas[zonaChaveAtual];
            xAlvoCamera = z.xPos;

            painelControle.style.borderColor = z.cor;
            hudTreinador.style.borderColor = z.cor;
            tempoEl.style.color = z.cor;
            barra.style.backgroundColor = z.cor;
            indicadorFaixa.textContent = `HIIT Faixa: ${z.nome}`;
            indicadorFaixa.style.color = z.cor;
            document.querySelectorAll('.dado span').forEach(el => el.style.color = z.cor);
            displayMat.color.set(z.hex);

            falarTreinador(etapa.fala);
        }

        function formatarTempo(s) {
            const h = Math.floor(s / 3600).toString().padStart(2, '0');
            const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
            const seg = (s % 60).toString().padStart(2, '0');
            return `${h}:${m}:${seg}`;
        }

        function atualizaTela() {
            const z = zonas[zonaChaveAtual];
            tempoEl.textContent = formatarTempo(tempoRestante);
            barra.style.width = `${tempoTotal > 0 ? ((tempoTotal - tempoRestante) / tempoTotal) * 100 : 0}%`;
            elCal.textContent = Math.round(calorias);
            elKm.textContent = distancia.toFixed(2);
            elVel.textContent = z.vel.toFixed(1);
        }

        btnIniciar.addEventListener('click', () => {
            if(tempoRestante <= 0) return;
            treinoAtivo = true;
            if(cronometro) clearInterval(cronometro);
            
            aplicarEtapaHIIT(indiceEtapaHIIT);

            cronometro = setInterval(() => {
                tempoRestante--;
                tempoSegundosEtapa++;

                const etapaAtual = cicloHIIT[indiceEtapaHIIT];

                if (tempoSegundosEtapa >= etapaAtual.duracao && tempoRestante > 0) {
                    indiceEtapaHIIT = (indiceEtapaHIIT + 1) % cicloHIIT.length;
                    aplicarEtapaHIIT(indiceEtapaHIIT);
                }

                const z = zonas[zonaChaveAtual];
                const multiplicadorCal = z.vel / 15;
                calorias += (12 * multiplicadorCal) / 60;
                distancia += z.vel / 3600;

                elRpm.textContent = Math.round(z.rpm + Math.sin(tempoRestante / 2) * 5);
                atualizaTela();

                if (tempoRestante <= 0) {
                    clearInterval(cronometro);
                    treinoAtivo = false;
                    falarTreinador("Parabéns! Treino HIIT concluído com sucesso!");
                    btnIniciar.disabled = btnParar.disabled = true;
                }
            }, 1000);
            
            btnIniciar.disabled = true;
            btnParar.disabled = false;
            btnReiniciar.disabled = false;
        });

        btnParar.addEventListener('click', () => {
            if (treinoAtivo) {
                clearInterval(cronometro);
                treinoAtivo = false;
                btnParar.textContent = "Continuar";
                falarTreinador("Treino HIIT pausado.");
            } else {
                btnIniciar.click();
                btnParar.textContent = "Pausar";
            }
        });

        btnReiniciar.addEventListener('click', () => {
            clearInterval(cronometro);
            tempoRestante = tempoTotal;
            indiceEtapaHIIT = 0;
            tempoSegundosEtapa = 0;
            calorias = 0; distancia = 0;
            treinoAtivo = false;
            aplicarEtapaHIIT(0);
            atualizaTela();
            falarTreinador("Treino HIIT reiniciado!");
            btnIniciar.disabled = false;
            btnParar.disabled = true;
            btnReiniciar.disabled = true;
            btnParar.textContent = "Pausar";
        });

        btnTela.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        /* LOOP ANIMATE */
        let step = 0;
        function animate() {
            requestAnimationFrame(animate);

            camera.position.x += (xAlvoCamera - camera.position.x) * 0.08;
            povGroup.position.x = camera.position.x;

            // Animação das gotas de chuva
            const posAttr = rainGeo.attributes.position;
            for (let i = 0; i < QTD_GOTAS; i++) {
                posAttr.array[i * 6 + 1] += velocidadeChuvaY;
                posAttr.array[i * 6 + 4] += velocidadeChuvaY;

                if (posAttr.array[i * 6 + 1] < 0) {
                    const novoY = 7 + Math.random() * 2;
                    posAttr.array[i * 6 + 1] = novoY;
                    posAttr.array[i * 6 + 4] = novoY - COMPRIMENTO_GOTA;
                }
            }
            posAttr.needsUpdate = true;

            if (treinoAtivo) {
                const z = zonas[zonaChaveAtual];
                step += 0.03 * (z.rpm / 60);
                const speed = z.vel / 60;

                trackLines.forEach(line => {
                    line.position.z += speed;
                    if (line.position.z > 5) line.position.z = -195;
                });

                // Movimento do corpo e guidão
                camera.position.y = 1.25 + Math.sin(step * 2) * 0.015;
                povGroup.position.y = Math.sin(step * 2) * 0.008;

                const anguloBalanco = Math.sin(step) * 0.05;
                povGroup.rotation.z = anguloBalanco;
                povGroup.rotation.y = Math.cos(step) * 0.02;

                // ATUALIZAÇÃO VISUAL DOS INDICADORES DE PEDALADA
                const fasePedal = Math.sin(step); // Alterna entre -1 e +1

                if (fasePedal > 0) {
                    // Pé Esquerdo Em Cima / Pé Direito Em Baixo
                    pedalEsq.className = "indicador-pedal esquerdo pedal-em-cima";
                    setaEsq.textContent = "⬆";
                    statusEsq.textContent = "CIMA";

                    pedalDir.className = "indicador-pedal direito pedal-em-baixo";
                    setaDir.textContent = "⬇";
                    statusDir.textContent = "BAIXO";
                } else {
                    // Pé Direito Em Cima / Pé Esquerdo Em Baixo
                    pedalEsq.className = "indicador-pedal esquerdo pedal-em-baixo";
                    setaEsq.textContent = "⬇";
                    statusEsq.textContent = "BAIXO";

                    pedalDir.className = "indicador-pedal direito pedal-em-cima";
                    setaDir.textContent = "⬆";
                    statusDir.textContent = "CIMA";
                }

            } else {
                povGroup.rotation.z *= 0.92;
                povGroup.rotation.y *= 0.92;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
