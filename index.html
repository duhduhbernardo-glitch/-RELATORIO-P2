<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino 3D — Cenários Aleatórios | Simulador POV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
        :root { --verde:#4CAF50; --escuro:#0a0a0c; --cinza:rgba(22, 22, 26, 0.85); --texto:#e0e0e0; --destaque:#81C784; }
        body, html { width:100%; height:100%; overflow:hidden; background:var(--escuro); color:var(--texto); }

        /* CANVAS 3D EM TELA CHEIA */
        #canvas-container { width:100vw; height:100vh; position:absolute; top:0; left:0; z-index:1; }

        .tag-cenario { 
            position:absolute; top:20px; left:20px; 
            background:rgba(0,0,0,0.7); padding:8px 15px; border-radius:20px; 
            font-size:0.85rem; color:#81C784; border:1px solid var(--verde); 
            pointer-events:none; z-index:2; backdrop-filter:blur(5px);
        }

        /* PAINEL DE CONTROLE FIXADO NA PARTE INFERIOR */
        .painel-controle { 
            position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
            width:95%; max-width:1100px; background:var(--cinza); 
            border-radius:18px; padding:15px 20px; border:2px solid var(--verde); 
            box-shadow:0 0 25px rgba(76,175,80,0.3); z-index:2; 
            backdrop-filter:blur(10px); display:flex; flex-direction:column; gap:10px;
        }

        .titulo-painel { font-size:1.1rem; color:var(--destaque); text-align:center; }

        .opcoes-tempo { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
        .botao-tempo { padding:6px 12px; font-size:0.85rem; font-weight:bold; border:2px solid #333; border-radius:8px; background:rgba(0,0,0,0.6); color:var(--texto); cursor:pointer; transition:0.2s; text-align:center; }
        .botao-tempo.selecionado { border-color:var(--verde); background:rgba(76,175,80,0.25); color:var(--verde); box-shadow:0 0 10px rgba(76,175,80,0.3); }
        .botao-tempo:hover { border-color:var(--destaque); }

        .dados-treino { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
        @media(max-width:768px){ .dados-treino { grid-template-columns:repeat(2, 1fr); } }

        .dado { background:rgba(0,0,0,0.6); padding:8px; border-radius:8px; text-align:center; border-left:4px solid var(--verde); }
        .dado span { font-size:1.2rem; font-weight:bold; color:var(--verde); display:block; font-family:monospace; }
        .dado label { font-size:0.75rem; color:#aaa; }

        .contador { text-align:center; padding:8px; background:rgba(0,0,0,0.6); border-radius:8px; border:1px solid var(--verde); }
        .tempo-restante { font-size:1.8rem; font-weight:bold; color:var(--verde); font-family: monospace; }
        .barra-progresso { width:100%; height:6px; background:#333; border-radius:3px; overflow:hidden; margin-top:4px; }
        .progresso { height:100%; background:linear-gradient(90deg, var(--verde), var(--destaque)); width:0%; transition:width 0.3s; }
        .status { font-size:0.8rem; color:#aaa; margin-top:4px; }

        .botoes-acao { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
        .btn { padding:8px 16px; font-size:0.85rem; font-weight:bold; border:none; border-radius:8px; cursor:pointer; transition:0.2s; }
        .btn.iniciar { background:var(--verde); color:white; }
        .btn.parar { background:#f44336; color:white; }
        .btn.reiniciar { background:#ff9800; color:white; }
        .btn.tela-cheia { background:#2196F3; color:white; }
        .btn:disabled { opacity:0.3; cursor:not-allowed; }
    </style>
</head>
<body>

    <!-- CANVAS 3D EM TELA CHEIA -->
    <div id="canvas-container">
        <div class="tag-cenario" id="nomeCenario">🌲 Cenário: Noturno Clássico</div>
    </div>

    <!-- PAINEL FIXO NA PARTE INFERIOR -->
    <div class="painel-controle">
        <h3 class="titulo-painel">⏱️ Selecione a Duração do Treino</h3>
        <div class="opcoes-tempo">
            <button class="botao-tempo" data-segundos="300">5 min</button>
            <button class="botao-tempo" data-segundos="600">10 min</button>
            <button class="botao-tempo" data-segundos="900">15 min</button>
            <button class="botao-tempo" data-segundos="1200">20 min</button>
            <button class="botao-tempo" data-segundos="1500">25 min</button>
            <button class="botao-tempo" data-segundos="1800">30 min</button>
            <button class="botao-tempo" data-segundos="2700">45 min</button>
            <button class="botao-tempo" data-segundos="3600">60 min</button>
        </div>

        <div class="dados-treino">
            <div class="dado"><span id="cal">0</span><label>Calorias (Kcal)</label></div>
            <div class="dado"><span id="km">0.00</span><label>Distância (km)</label></div>
            <div class="dado"><span id="vel">22.5</span><label>Velocidade (km/h)</label></div>
            <div class="dado"><span id="rpm">75</span><label>Cadência (RPM)</label></div>
        </div>

        <div class="contador">
            <div class="tempo-restante" id="tempo">00:00:00</div>
            <div class="barra-progresso"><div class="progresso" id="barra"></div></div>
            <div class="status" id="status">Escolha o tempo para sortear o cenário 3D</div>
        </div>

        <div class="botoes-acao">
            <button class="btn iniciar" id="btnIniciar" disabled>Iniciar</button>
            <button class="btn parar" id="btnParar" disabled>Pausar</button>
            <button class="btn reiniciar" id="btnReiniciar" disabled>Reiniciar</button>
            <button class="btn tela-cheia" id="btnTela">Tela Cheia</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        
        /* CENA & CÂMERA POV 3D */
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.25, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        /* ILUMINAÇÃO GERAL E FAROL DO GUIDÃO */
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const headlight = new THREE.SpotLight(0xffffff, 3, 45, Math.PI / 4, 0.5);
        headlight.position.set(0, 1.0, -0.2);
        headlight.target.position.set(0, 0, -20);
        scene.add(headlight);
        scene.add(headlight.target);

        /* GUIDÃO DO CICLISTA (FIXO EM POV) */
        const povGroup = new THREE.Group();
        scene.add(povGroup);

        const matHandle = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
        const matGrip = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });

        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3), matHandle);
        stem.rotation.x = Math.PI / 3;
        stem.position.set(0, 0.85, -0.4);
        povGroup.add(stem);

        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.7), matHandle);
        bar.rotation.z = Math.PI / 2;
        bar.position.set(0, 0.95, -0.5);
        povGroup.add(bar);

        const gripL = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);
        gripL.rotation.z = Math.PI / 2;
        gripL.position.set(0.3, 0.95, -0.5);
        povGroup.add(gripL);

        const gripR = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);
        gripR.rotation.z = Math.PI / 2;
        gripR.position.set(-0.3, 0.95, -0.5);
        povGroup.add(gripR);

        // Ciclocomputador Digital no Guidão
        const screenGeo = new THREE.BoxGeometry(0.12, 0.08, 0.02);
        const screenMat = new THREE.MeshBasicMaterial({ color: 0x4CAF50 });
        const display = new THREE.Mesh(screenGeo, screenMat);
        display.position.set(0, 1.0, -0.48);
        display.rotation.x = -Math.PI / 6;
        povGroup.add(display);

        /* PISTA E ESTRUTURAS DO CENÁRIO */
        const roadGeo = new THREE.PlaneGeometry(12, 200);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x15151c, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0, -90);
        scene.add(road);

        const trackLines = [];
        const lineGeo = new THREE.BoxGeometry(0.15, 0.01, 2);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        for (let i = 0; i < 20; i++) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.position.set(0, 0.01, -i * 10);
            scene.add(line);
            trackLines.push(line);
        }

        const polesGroup = new THREE.Group();
        scene.add(polesGroup);

        const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 4);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const lampGeo = new THREE.SphereGeometry(0.25, 16, 16);
        let lampMat = new THREE.MeshBasicMaterial({ color: 0x81C784 });

        const poles = [];
        for (let i = 0; i < 10; i++) {
            const poleL = new THREE.Mesh(poleGeo, poleMat);
            poleL.position.set(-4.5, 2, -i * 20);
            const lampL = new THREE.Mesh(lampGeo, lampMat);
            lampL.position.set(-4.5, 4, -i * 20);

            const poleR = new THREE.Mesh(poleGeo, poleMat);
            poleR.position.set(4.5, 2, -i * 20);
            const lampR = new THREE.Mesh(lampGeo, lampMat);
            lampR.position.set(4.5, 4, -i * 20);

            polesGroup.add(poleL); polesGroup.add(lampL);
            polesGroup.add(poleR); polesGroup.add(lampR);
            poles.push(poleL, lampL, poleR, lampR);
        }

        /* BANCO DE CENÁRIOS ALEATÓRIOS */
        const temasCenarios = [
            { nome: "🌃 Circuito Cyber Neon", bg: 0x060411, road: 0x090814, line: 0x00ffff, light: 0xff00ff, fog: 0.02 },
            { nome: "🌅 Pôr do Sol na Rodovia", bg: 0x2b1108, road: 0x1c1716, line: 0xffaa00, light: 0xff4500, fog: 0.015 },
            { nome: "🌲 Estradas da Floresta", bg: 0x03120e, road: 0x0f1715, line: 0x4CAF50, light: 0x81C784, fog: 0.025 },
            { nome: "🌌 Pista Galáctica Noturna", bg: 0x0a0a16, road: 0x141424, line: 0x3f51b5, light: 0x00bcd4, fog: 0.018 },
            { nome: "🏙️ Túnel Urbano Noturno", bg: 0x111111, road: 0x222222, line: 0xffeb3b, light: 0xffffff, fog: 0.012 }
        ];

        function gerarCenarioAleatorio() {
            const tema = temasCenarios[Math.floor(Math.random() * temasCenarios.length)];
            scene.background = new THREE.Color(tema.bg);
            scene.fog = new THREE.FogExp2(tema.bg, tema.fog);
            roadMat.color.setHex(tema.road);
            lineMat.color.setHex(tema.line);
            headlight.color.setHex(tema.light);
            lampMat.color.setHex(tema.light);
            display.material.color.setHex(tema.line);
            document.getElementById('nomeCenario').textContent = `🎮 Cenário: ${tema.nome}`;
        }

        gerarCenarioAleatorio(); // Cenário Inicial

        /* LÓGICA DO CONTROLE DO TREINO */
        const botoesTempo = document.querySelectorAll('.botao-tempo');
        const tempoEl = document.getElementById('tempo');
        const statusEl = document.getElementById('status');
        const btnIniciar = document.getElementById('btnIniciar');
        const btnParar = document.getElementById('btnParar');
        const btnReiniciar = document.getElementById('btnReiniciar');
        const btnTela = document.getElementById('btnTela');
        const barra = document.getElementById('barra');
        const elCal = document.getElementById('cal');
        const elKm = document.getElementById('km');
        const elRpm = document.getElementById('rpm');

        let tempoTotal = 0, tempoRestante = 0, cronometro = null, treinoAtivo = false;
        let calorias = 0, distancia = 0, vel = 22.5;
        const calPorSegundo = 9 / 60;

        botoesTempo.forEach(btn => {
            btn.addEventListener('click', () => {
                botoesTempo.forEach(b => b.classList.remove('selecionado'));
                btn.classList.add('selecionado');
                tempoTotal = parseInt(btn.dataset.segundos);
                tempoRestante = tempoTotal;
                
                gerarCenarioAleatorio(); // Sorteia um novo cenário a cada tempo escolhido
                atualizaTela();
                btnIniciar.disabled = false;
                statusEl.textContent = `Tempo configurado: ${btn.textContent} | Cenário gerado!`;
            });
        });

        function formatarTempo(s) {
            const h = Math.floor(s / 3600).toString().padStart(2, '0');
            const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
            const seg = (s % 60).toString().padStart(2, '0');
            return `${h}:${m}:${seg}`;
        }

        function atualizaTela() {
            tempoEl.textContent = formatarTempo(tempoRestante);
            const pct = tempoTotal > 0 ? ((tempoTotal - tempoRestante) / tempoTotal) * 100 : 0;
            barra.style.width = `${pct}%`;
            elCal.textContent = Math.round(calorias);
            elKm.textContent = distancia.toFixed(2);
        }

        btnIniciar.addEventListener('click', () => {
            if(tempoRestante <= 0) return;
            treinoAtivo = true;
            iniciarLoop();
            btnIniciar.disabled = true;
            btnParar.disabled = false;
            btnReiniciar.disabled = false;
            statusEl.textContent = "🔥 Pedala! Treino 3D em andamento...";
        });

        function iniciarLoop() {
            if(cronometro) clearInterval(cronometro);
            cronometro = setInterval(() => {
                tempoRestante--;
                calorias += calPorSegundo;
                distancia += vel / 3600;

                // Dinâmica leve no ritmo de pedalada
                const flutuacao = Math.sin(tempoRestante / 3) * 5;
                elRpm.textContent = Math.round(75 + flutuacao);

                atualizaTela();

                if (tempoRestante <= 0) {
                    clearInterval(cronometro);
                    treinoAtivo = false;
                    statusEl.textContent = "🏆 Excelente! Treino concluído!";
                    btnIniciar.disabled = btnParar.disabled = true;
                }
            }, 1000);
        }

        btnParar.addEventListener('click', () => {
            if (treinoAtivo) {
                clearInterval(cronometro);
                treinoAtivo = false;
                btnParar.textContent = "Continuar";
                statusEl.textContent = "⏸️ Treino Pausado";
            } else {
                treinoAtivo = true;
                iniciarLoop();
                btnParar.textContent = "Pausar";
                statusEl.textContent = "🔥 Treino Retomado!";
            }
        });

        btnReiniciar.addEventListener('click', () => {
            clearInterval(cronometro);
            tempoRestante = tempoTotal;
            calorias = 0;
            distancia = 0;
            treinoAtivo = false;
            gerarCenarioAleatorio(); // Troca o cenário ao reiniciar
            atualizaTela();
            btnIniciar.disabled = false;
            btnParar.disabled = true;
            btnReiniciar.disabled = true;
            btnParar.textContent = "Pausar";
            statusEl.textContent = "Sessão e cenário reiniciados.";
        });

        btnTela.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        /* RENDER E ANIMAÇÃO DO MOVIMENTO 3D */
        let step = 0;
        function animate() {
            requestAnimationFrame(animate);

            if (treinoAtivo) {
                step += 0.05;

                // Velocidade de deslocamento dos elementos do cenário
                const speed = 0.4;

                trackLines.forEach(line => {
                    line.position.z += speed;
                    if (line.position.z > 5) line.position.z = -195;
                });

                for (let i = 0; i < poles.length; i++) {
                    poles[i].position.z += speed;
                    if (poles[i].position.z > 5) poles[i].position.z = -195;
                }

                // Efeito do movimento do ciclista pedalando (POV)
                camera.position.y = 1.25 + Math.sin(step * 2) * 0.015;
                povGroup.position.x = Math.cos(step) * 0.008;
                povGroup.position.y = Math.sin(step * 2) * 0.008;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
