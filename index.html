<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treino 3D — Treinador & Faixa Colorida</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body, html { width:100%; height:100%; overflow:hidden; background:#000; color:#fff; }

        #canvas-container { width:100vw; height:100vh; position:absolute; top:0; left:0; z-index:1; }

        .tag-cenario { 
            position:absolute; top:8px; left:8px; 
            background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:10px; 
            font-size:0.65rem; color:#81C784; z-index:2; pointer-events:none;
        }

        /* HUD DO TREINADOR VIRTUAL */
        .hud-treinador {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 480px; background: rgba(0, 0, 0, 0.85);
            border: 2px solid #2196F3; border-radius: 10px; padding: 10px 14px;
            z-index: 3; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            transition: border-color 0.5s, box-shadow 0.5s;
        }
        .treinador-avatar { font-size: 2rem; }
        .treinador-info { display: flex; flex-direction: column; flex: 1; }
        .treinador-nome { font-size: 0.65rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; font-weight: bold; }
        .treinador-fala { font-size: 0.85rem; font-weight: bold; color: #fff; line-height: 1.2; }

        .painel-controle { 
            position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
            width:90%; max-width:420px; background:rgba(10, 10, 12, 0.85); 
            border-radius:12px; padding:10px 12px; border:2px solid #2196F3; 
            z-index:2; backdrop-filter:blur(6px); display:flex; flex-direction:column; gap:8px;
            transition: border-color 0.5s ease;
        }

        .secao-label { font-size:0.55rem; color:#aaa; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }

        .opcoes-tempo { display:flex; gap:4px; overflow-x:auto; padding-bottom:2px; }
        .opcoes-tempo::-webkit-scrollbar { display:none; }

        .botao-tempo { 
            padding:4px 8px; font-size:0.65rem; font-weight:bold; 
            border:1px solid #333; border-radius:4px; background:rgba(0,0,0,0.6); 
            color:#ccc; cursor:pointer; white-space:nowrap; transition:all 0.3s;
        }
        .botao-tempo.selecionado { border-color:#fff; background:rgba(255,255,255,0.25); color:#fff; }

        /* BADGE DA ZONA DEFINIDA PELO COACH */
        .badge-zona-atual {
            display: inline-block; padding: 4px 10px; border-radius: 6px;
            font-size: 0.75rem; font-weight: bold; text-align: center;
            background: #2196F3; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            transition: background-color 0.5s ease;
        }

        .dados-treino { display:flex; justify-content:space-between; text-align:center; background:rgba(0,0,0,0.4); padding:6px 8px; border-radius:6px; }
        .dado { flex:1; }
        .dado span { font-size:0.9rem; font-weight:bold; color:#2196F3; font-family:monospace; transition:color 0.5s; }
        .dado label { font-size:0.55rem; color:#888; display:block; }

        .tempo-restante { font-size:1.1rem; font-weight:bold; color:#2196F3; font-family:monospace; text-align:center; transition:color 0.5s; }
        .barra-progresso { width:100%; height:4px; background:#222; border-radius:2px; overflow:hidden; }
        .progresso { height:100%; background:#2196F3; width:0%; transition:width 0.3s, background-color 0.5s; }

        .botoes-acao { display:flex; gap:4px; justify-content:center; }
        .btn { padding:5px 12px; font-size:0.7rem; font-weight:bold; border:none; border-radius:4px; cursor:pointer; }
        .btn.iniciar { background:#4CAF50; color:white; }
        .btn.parar { background:#f44336; color:white; }
        .btn.reiniciar { background:#ff9800; color:white; }
        .btn.tela-cheia { background:#2196F3; color:white; }
        .btn:disabled { opacity:0.3; cursor:not-allowed; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="tag-cenario" id="nomeCenario">🌧️ Cyber Chuva Neon</div>
    </div>

    <!-- PAINEL DO TREINADOR VIRTUAL -->
    <div class="hud-treinador" id="hudTreinador">
        <div class="treinador-avatar">🚴‍♂️</div>
        <div class="treinador-info">
            <div class="treinador-nome">Treinador Automático</div>
            <div class="treinador-fala" id="falaTreinador">Selecione o tempo e clique em Iniciar Treino para ativar o áudio e a pista!</div>
        </div>
    </div>

    <div class="painel-controle" id="painelControle">
        <div class="secao-label">Duração do Treino:</div>
        <div class="opcoes-tempo">
            <button class="botao-tempo" data-segundos="300">5m</button>
            <button class="botao-tempo" data-segundos="600">10m</button>
            <button class="botao-tempo" data-segundos="900">15m</button>
            <button class="botao-tempo" data-segundos="1200">20m</button>
            <button class="botao-tempo" data-segundos="1800">30m</button>
            <button class="botao-tempo" data-segundos="3600">60m</button>
        </div>

        <div class="secao-label">Ritmo Determinado pelo Coach:</div>
        <div>
            <span class="badge-zona-atual" id="badgeZona">Z1 — Aquecimento (Esperando)</span>
        </div>

        <div class="dados-treino">
            <div class="dado"><span id="cal">0</span><label>Kcal</label></div>
            <div class="dado"><span id="km">0.00</span><label>Km</label></div>
            <div class="dado"><span id="vel">18.0</span><label>Km/h</label></div>
            <div class="dado"><span id="rpm">65</span><label>RPM</label></div>
        </div>

        <div class="tempo-restante" id="tempo">00:00:00</div>
        <div class="barra-progresso"><div class="progresso" id="barra"></div></div>

        <div class="botoes-acao">
            <button class="btn iniciar" id="btnIniciar" disabled>Iniciar Treino</button>
            <button class="btn parar" id="btnParar" disabled>Pausar</button>
            <button class="btn reiniciar" id="btnReiniciar" disabled>Reiniciar</button>
            <button class="btn tela-cheia" id="btnTela">Tela Cheia</button>
        </div>
    </div>

    <script>
        /* DEFINIÇÃO DAS ZONAS DE ESFORÇO */
        const zonasTreino = [
            {
                id: 'z1',
                nome: 'Z1 — Aquecimento (Azul)',
                vel: 18.0,
                rpm: 65,
                cor: 0x2196F3,
                hexCor: '#2196F3',
                falas: [
                    "Modo Z1 ativo! Mantenha giros leves e respiração suave.",
                    "Aproveite para aquecer as pernas e preparar o coração.",
                    "Ritmo leve de recuperação! Gire suavemente."
                ]
            },
            {
                id: 'z2',
                nome: 'Z2 — Moderado (Verde)',
                vel: 26.0,
                rpm: 82,
                cor: 0x4CAF50,
                hexCor: '#4CAF50',
                falas: [
                    "Atenção, mudando para Z2! Entre no ritmo de cruzeiro.",
                    "Aumente ligeiramente a cadência. Mantenha a força nos pedais!",
                    "Ótimo ritmo para queimar gordura e ganhar resistência!"
                ]
            },
            {
                id: 'z3',
                nome: 'Z3 — Limiar / Forte (Laranja)',
                vel: 34.0,
                rpm: 96,
                cor: 0xFF9800,
                hexCor: '#FF9800',
                falas: [
                    "Subindo para Z3! Pressione mais forte os pedais!",
                    "Ritmo forte! Segure a cadência em 95 RPM!",
                    "Sinta o esforço! Respiração funda e foco na pista!"
                ]
            },
            {
                id: 'z4',
                nome: 'Z4 — SPRINT MÁXIMO! (Vermelho)',
                vel: 45.0,
                rpm: 120,
                cor: 0xF44336,
                hexCor: '#F44336',
                falas: [
                    "HORA DO TIRO! Z4 SPRINT! Acelera tudo!",
                    "Força máxima nos pedais! Vai vai vai!",
                    "Dê o seu máximo agora! Não solte o guidão!"
                ]
            }
        ];

        let zonaAtualObj = zonasTreino[0];

        /* SINTETIZADOR DE VOZ E ÁUDIO CONTEXT */
        let audioCtx = null;
        function iniciarAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function tocarSomTrocaZona() {
            iniciarAudioContext();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function falarTreinador(texto) {
            document.getElementById('falaTreinador').textContent = texto;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const fala = new SpeechSynthesisUtterance(texto);
                fala.lang = 'pt-BR';
                fala.rate = 1.05;
                fala.volume = 1.0;
                window.speechSynthesis.speak(fala);
            }
        }

        /* THREE.JS SETUP */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.25, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const headlight = new THREE.SpotLight(0xffffff, 3, 45, Math.PI / 4, 0.5);
        headlight.position.set(0, 1.0, -0.2);
        headlight.target.position.set(0, 0, -20);
        scene.add(headlight); scene.add(headlight.target);

        /* POV GUIDÃO */
        const povGroup = new THREE.Group();
        scene.add(povGroup);
        const matHandle = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
        const matGrip = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });

        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3), matHandle);
        stem.rotation.x = Math.PI / 3; stem.position.set(0, 0.85, -0.4); povGroup.add(stem);

        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.7), matHandle);
        bar.rotation.z = Math.PI / 2; bar.position.set(0, 0.95, -0.5); povGroup.add(bar);

        const gripL = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);
        gripL.rotation.z = Math.PI / 2; gripL.position.set(0.3, 0.95, -0.5); povGroup.add(gripL);

        const gripR = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);
        gripR.rotation.z = Math.PI / 2; gripR.position.set(-0.3, 0.95, -0.5); povGroup.add(gripR);

        const displayMat = new THREE.MeshBasicMaterial({ color: 0x2196F3 });
        const display = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.02), displayMat);
        display.position.set(0, 1.0, -0.48); display.rotation.x = -Math.PI / 6; povGroup.add(display);

        /* PISTA E FAIXA CENTRAL DESTACADA DO RITMO */
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.8 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 200), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -90); scene.add(road);

        // FAIXA COLORIDA CENTRAL QUE INDICA O RITMO DE CADA ZONA
        const faixaCentralMat = new THREE.MeshBasicMaterial({ color: 0x2196F3 });
        const faixaCentral = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.02, 200), faixaCentralMat);
        faixaCentral.position.set(0, 0.01, -90); scene.add(faixaCentral);

        const trackLines = [];
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = 0; i < 20; i++) {
            const line = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 2), lineMat);
            line.position.set(-1.8, 0.015, -i * 10); scene.add(line); trackLines.push(line);
            const line2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 2), lineMat);
            line2.position.set(1.8, 0.015, -i * 10); scene.add(line2); trackLines.push(line2);
        }

        const polesGroup = new THREE.Group(); scene.add(polesGroup);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        let lampMat = new THREE.MeshBasicMaterial({ color: 0x81C784 });
        const poles = [];
        for (let i = 0; i < 10; i++) {
            const poleL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 4), poleMat); poleL.position.set(-4.5, 2, -i * 20);
            const lampL = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), lampMat); lampL.position.set(-4.5, 4, -i * 20);
            const poleR = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 4), poleMat); poleR.position.set(4.5, 2, -i * 20);
            const lampR = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), lampMat); lampR.position.set(4.5, 4, -i * 20);
            polesGroup.add(poleL); polesGroup.add(lampL); polesGroup.add(poleR); polesGroup.add(lampR);
            poles.push(poleL, lampL, poleR, lampR);
        }

        /* CHUVA 3D */
        const QTD_GOTAS = 400;
        const rainGeo = new THREE.BufferGeometry();
        const rainPositions = new Float32Array(QTD_GOTAS * 6);
        const COMPRIMENTO_GOTA = 0.4;

        for (let i = 0; i < QTD_GOTAS; i++) {
            const x = (Math.random() - 0.5) * 16;
            const y = Math.random() * 8;
            const z = -Math.random() * 30;

            rainPositions[i * 6] = x;
            rainPositions[i * 6 + 1] = y;
            rainPositions[i * 6 + 2] = z;

            rainPositions[i * 6 + 3] = x;
            rainPositions[i * 6 + 4] = y - COMPRIMENTO_GOTA;
            rainPositions[i * 6 + 5] = z;
        }

        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
        const rainMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.65 });
        const rainSystem = new THREE.LineSegments(rainGeo, rainMat);
        scene.add(rainSystem);

        let velocidadeChuvaY = -0.08;

        /* VARIAVEIS DE ESTADO */
        const botoesTempo = document.querySelectorAll('.botao-tempo');
        const painelControle = document.getElementById('painelControle');
        const hudTreinador = document.getElementById('hudTreinador');
        const badgeZona = document.getElementById('badgeZona');
        const tempoEl = document.getElementById('tempo');
        const btnIniciar = document.getElementById('btnIniciar');
        const btnParar = document.getElementById('btnParar');
        const btnReiniciar = document.getElementById('btnReiniciar');
        const btnTela = document.getElementById('btnTela');
        const barra = document.getElementById('barra');
        const elCal = document.getElementById('cal');
        const elKm = document.getElementById('km');
        const elVel = document.getElementById('vel');
        const elRpm = document.getElementById('rpm');

        let tempoTotal = 0, tempoRestante = 0, cronometro = null, treinoAtivo = false;
        let calorias = 0, distancia = 0;
        let fatorAvancoPista = 0.3;
        let proximaTrocaZonaEm = 0;

        function aplicarZonaPeloTreinador(novaZona, motivoFala) {
            zonaAtualObj = novaZona;
            fatorAvancoPista = zonaAtualObj.vel / 60;

            // Interface
            badgeZona.textContent = zonaAtualObj.nome;
            badgeZona.style.backgroundColor = zonaAtualObj.hexCor;
            painelControle.style.borderColor = zonaAtualObj.hexCor;
            hudTreinador.style.borderColor = zonaAtualObj.hexCor;
            tempoEl.style.color = zonaAtualObj.hexCor;
            barra.style.backgroundColor = zonaAtualObj.hexCor;
            document.querySelectorAll('.dado span').forEach(el => el.style.color = zonaAtualObj.hexCor);

            // Objetos 3D
            displayMat.color.setHex(zonaAtualObj.cor);
            faixaCentralMat.color.setHex(zonaAtualObj.cor); // Atualiza a cor da Faixa na Pista!

            tocarSomTrocaZona();
            const falaTexto = motivoFala || zonaAtualObj.falas[Math.floor(Math.random() * zonaAtualObj.falas.length)];
            falarTreinador(falaTexto);
        }

        function escolherProximaZonaAleatoria() {
            let zonasPossiveis = zonasTreino.filter(z => z.id !== zonaAtualObj.id);
            let zonaEscolhida = zonasPossiveis[Math.floor(Math.random() * zonasPossiveis.length)];
            
            proximaTrocaZonaEm = Math.floor(Math.random() * 21) + 20; // 20 a 40 segs
            aplicarZonaPeloTreinador(zonaEscolhida);
        }

        botoesTempo.forEach(btn => {
            btn.addEventListener('click', () => {
                botoesTempo.forEach(b => b.classList.remove('selecionado'));
                btn.classList.add('selecionado');
                tempoTotal = parseInt(btn.dataset.segundos);
                tempoRestante = tempoTotal;
                atualizaTela();
                btnIniciar.disabled = false;
            });
        });

        function formatarTempo(s) {
            const h = Math.floor(s / 3600).toString().padStart(2, '0');
            const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
            const seg = (s % 60).toString().padStart(2, '0');
            return `${h}:${m}:${seg}`;
        }

        function atualizaTela() {
            tempoEl.textContent = formatarTempo(tempoRestante);
            barra.style.width = `${tempoTotal > 0 ? ((tempoTotal - tempoRestante) / tempoTotal) * 100 : 0}%`;
            elCal.textContent = Math.round(calorias);
            elKm.textContent = distancia.toFixed(2);
            elVel.textContent = zonaAtualObj.vel.toFixed(1);
        }

        btnIniciar.addEventListener('click', () => {
            if(tempoRestante <= 0) return;
            iniciarAudioContext();

            treinoAtivo = true;
            if(cronometro) clearInterval(cronometro);

            aplicarZonaPeloTreinador(zonasTreino[0], "Treino iniciado! Começaremos em Z1 para aquecer!");
            proximaTrocaZonaEm = 25;

            cronometro = setInterval(() => {
                tempoRestante--;
                proximaTrocaZonaEm--;

                const multiplicadorCal = zonaAtualObj.vel / 15;
                calorias += (9 * multiplicadorCal) / 60;
                distancia += zonaAtualObj.vel / 3600;

                elRpm.textContent = Math.round(zonaAtualObj.rpm + Math.sin(tempoRestante / 2) * 4);
                atualizaTela();

                if (proximaTrocaZonaEm <= 0 && tempoRestante > 10) {
                    escolherProximaZonaAleatoria();
                }

                if (tempoRestante <= 0) {
                    clearInterval(cronometro);
                    treinoAtivo = false;
                    falarTreinador("Parabéns! Treino concluído com sucesso!");
                    btnIniciar.disabled = btnParar.disabled = true;
                }
            }, 1000);

            btnIniciar.disabled = true;
            btnParar.disabled = false;
            btnReiniciar.disabled = false;
        });

        btnParar.addEventListener('click', () => {
            if (treinoAtivo) {
                clearInterval(cronometro);
                treinoAtivo = false;
                btnParar.textContent = "Continuar";
                falarTreinador("Treino pausado. Respire fundo.");
            } else {
                btnIniciar.click();
                btnParar.textContent = "Pausar";
            }
        });

        btnReiniciar.addEventListener('click', () => {
            clearInterval(cronometro);
            tempoRestante = tempoTotal;
            calorias = 0; distancia = 0;
            treinoAtivo = false;
            aplicarZonaPeloTreinador(zonasTreino[0], "Treino resetado. Aperte iniciar quando estiver pronto!");
            atualizaTela();
            btnIniciar.disabled = false;
            btnParar.disabled = true;
            btnReiniciar.disabled = true;
            btnParar.textContent = "Pausar";
        });

        btnTela.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        /* LOOP ANIMATE */
        let step = 0;
        function animate() {
            requestAnimationFrame(animate);

            // Mover chuva
            const posAttr = rainGeo.attributes.position;
            for (let i = 0; i < QTD_GOTAS; i++) {
                posAttr.array[i * 6 + 1] += velocidadeChuvaY;
                posAttr.array[i * 6 + 4] += velocidadeChuvaY;

                if (posAttr.array[i * 6 + 1] < 0) {
                    const novoY = 7 + Math.random() * 2;
                    posAttr.array[i * 6 + 1] = novoY;
                    posAttr.array[i * 6 + 4] = novoY - COMPRIMENTO_GOTA;
                }
            }
            posAttr.needsUpdate = true;

            if (treinoAtivo) {
                const frequenciaVibracao = zonaAtualObj.rpm / 35;
                step += 0.04 * frequenciaVibracao;
                const speed = fatorAvancoPista;

                trackLines.forEach(line => {
                    line.position.z += speed;
                    if (line.position.z > 5) line.position.z = -195;
                });

                for (let i = 0; i < poles.length; i++) {
                    poles[i].position.z += speed;
                    if (poles[i].position.z > 5) poles[i].position.z = -195;
                }

                camera.position.y = 1.25 + Math.sin(step * 2) * 0.015;
                povGroup.position.x = Math.cos(step) * 0.008;
                povGroup.position.y = Math.sin(step * 2) * 0.008;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
