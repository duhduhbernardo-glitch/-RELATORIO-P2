<html style="margin:0;padding:0;">

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script>

  var s = document.createElement('style');

  s.textContent = ':root{' +

    '--accent-primary:#00e5a0;' +

    '--accent-secondary:#ff6b35;' +

    '--accent-blue:#4fc3f7;' +

    '--accent-red:#ff5252;' +

    '--accent-yellow:#ffd54f;' +

    '--bg-dark:#0a0e17;' +

    '--bg-card:rgba(15,20,30,0.85);' +

    '--border-glow:rgba(0,229,160,0.3);' +

  '}' +

  '*{margin:0;padding:0;box-sizing:border-box;font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}' +

  'body,html{width:100%;min-height:100vh;background:radial-gradient(ellipse at top,#1a1f2e 0%,#0a0e17 50%,#050810 100%);color:#fff;-webkit-user-select:none;user-select:none;overflow-x:hidden}' +

  '#canvas-container{width:100%;position:relative;z-index:1}' +

  /* FUNDO DECORATIVO */

  'body::before{content:"";position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(0,229,160,0.03) 0%,transparent 50%);pointer-events:none;z-index:0;animation:brilhoFundo 20s ease-in-out infinite alternate}' +

  '@keyframes brilhoFundo{0%{transform:translate(0,0)}100%{transform:translate(5%,5%)}}' +

  /* HUD SUPERIOR */

  '.hud-superior{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:94%;max-width:650px;z-index:10;display:flex;flex-direction:column;gap:6px;pointer-events:none}' +

  '.hud-linha-topo{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(15,20,30,0.9),rgba(20,30,45,0.85));border:1px solid var(--border-glow);border-radius:14px;padding:8px 16px;backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)}' +

  /* ESPECTRO DE ZONAS */

  '.espectro-zonas{display:flex;gap:5px;height:24px;width:100%;background:rgba(0,0,0,0.4);border-radius:8px;padding:3px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(8px)}' +

  '.bloco-zona.ativo{opacity:1;transform:scaleY(1.2);box-shadow:0 0 20px currentColor,0 0 40px currentColor}' +

  '.bloco-zona.ativo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:brilhoZona 1.5s ease-in-out infinite}' +

  '@keyframes brilhoZona{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}' +

  /* PAINEIS DE SETAS (PEDALADA) */

  '.painel-seta{position:absolute;bottom:220px;width:clamp(65px,13vw,95px);height:clamp(90px,17vw,125px);background:linear-gradient(145deg,rgba(15,20,30,0.95),rgba(25,35,50,0.9));border:2px solid rgba(255,255,255,0.1);border-radius:18px;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(12px);transition:all 0.08s cubic-bezier(0.4,0,0.2,1);pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.05)}' +

  '.painel-seta.direita{right:calc(50% - clamp(100px,19vw,140px))}' +

  '.painel-seta.ativo-baixo .seta-status{color:#6b7589}' +

  '.opcoes-tempo::-webkit-scrollbar{display:none}' +

  '.barra-progresso{width:100%;height:10px;background:rgba(255,255,255,0.08);border-radius:6px;overflow:hidden;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,0.4)}' +

  '.progresso::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:brilhoProgresso 2s linear infinite}' +

  '@keyframes brilhoProgresso{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}' +

  '.sub-progresso-etapa{font-size:clamp(0.55rem,1.4vw,0.7rem);color:#8892a6;font-family:Orbitron,monospace;text-align:right;letter-spacing:0.5px}' +

  '.botoes-acao{display:flex;gap:8px;flex-wrap:wrap}' +

  '.btn{flex:1;min-width:85px;padding:10px 12px;font-size:clamp(0.6rem,1.5vw,0.75rem);font-weight:900;border:none;border-radius:12px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;font-family:Orbitron,sans-serif;box-shadow:0 4px 15px rgba(0,0,0,0.3)}' +

  '.btn::before{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,0.15),transparent);pointer-events:none;border-radius:12px 12px 0 0}' +

  '.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.4)}' +

  '.btn:active{transform:translateY(0) scale(0.97)}' +

  '.btn.iniciar{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;box-shadow:0 4px 15px rgba(46,125,50,0.4)}' +

  '.btn.iniciar:hover{box-shadow:0 6px 25px rgba(46,125,50,0.5)}' +

  '.btn.parar{background:linear-gradient(135deg,#c62828,#e53935);color:#fff;box-shadow:0 4px 15px rgba(198,40,40,0.4)}' +

  '.btn.parar:hover{box-shadow:0 6px 25px rgba(198,40,40,0.5)}' +

  '.btn.reiniciar{background:linear-gradient(135deg,#ef6c00,#fb8c00);color:#fff;box-shadow:0 4px 15px rgba(239,108,0,0.4)}' +

  '.btn.reiniciar:hover{box-shadow:0 6px 25px rgba(239,108,0,0.5)}' +

  '.btn.sequencia{background:linear-gradient(135deg,#6a1b9a,#8e24aa);color:#fff;flex:1.5;box-shadow:0 4px 15px rgba(106,27,154,0.4)}' +

  '.btn.sequencia:hover{box-shadow:0 6px 25px rgba(106,27,154,0.5)}' +

  '.btn.tela-cheia{background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;box-shadow:0 4px 15px rgba(21,101,192,0.4)}' +

  '.btn.tela-cheia:hover{box-shadow:0 6px 25px rgba(21,101,192,0.5)}' +

  '.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none!important;box-shadow:none!important;filter:grayscale(0.3)}' +

  /* APP WRAPPER */

  '.app-wrapper{position:relative;max-width:950px;margin:0 auto;border-radius:24px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,0.8),0 0 100px rgba(0,229,160,0.08);border:1px solid rgba(255,255,255,0.08);background:#0a0e17}' +

  '.app-wrapper::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent-primary),transparent);z-index:20;opacity:0.7}' +

  /* MODAL SEQUENCIAS */

  '.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,8,16,0.92);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(12px)}' +

  '.modal-overlay.aberto{display:flex;animation:fadeIn 0.3s ease}' +

  '@keyframes fadeIn{from{opacity:0}to{opacity:1}}' +

  '.modal{background:linear-gradient(145deg,rgba(18,24,36,0.98),rgba(12,18,28,0.98));border:1px solid rgba(0,229,160,0.3);border-radius:22px;padding:24px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,0.9),0 0 60px rgba(0,229,160,0.1);animation:slideUp 0.4s cubic-bezier(0.4,0,0.2,1)}' +

  '@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}' +

  '.modal-fechar:hover{color:var(--accent-secondary);transform:rotate(90deg)}' +

  '.input-nome-sequencia:focus{border-color:var(--accent-primary);box-shadow:0 0 20px rgba(0,229,160,0.15)}' +

  '.input-nome-sequencia::placeholder{color:#5a6478}' +

  '.lista-etapas{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-height:340px;overflow-y:auto;padding-right:8px}' +

  '.lista-etapas::-webkit-scrollbar{width:6px}' +

  '.lista-etapas::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);border-radius:3px}' +

  '.lista-etapas::-webkit-scrollbar-thumb{background:rgba(0,229,160,0.3);border-radius:3px}' +

  '.etapa-item{display:grid;grid-template-columns:1fr 100px 50px 44px;gap:10px;align-items:center;background:rgba(0,0,0,0.4);padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);transition:all 0.3s}' +

  '.etapa-item .btn-remover:hover{transform:scale(1.1);box-shadow:0 4px 15px rgba(198,40,40,0.5)}' +

  '.btn-adicionar-etapa:hover{background:rgba(0,229,160,0.18);border-color:var(--accent-primary);transform:translateY(-1px)}' +

  '.modal-botoes{display:flex;gap:10px}' +

  '.modal-botoes .btn{flex:1;padding:12px;font-size:clamp(0.7rem,1.8vw,0.85rem)}' +

  '.sequencias-salvas{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.08)}' +

  '.sequencias-salvas-titulo{font-size:clamp(0.65rem,1.6vw,0.8rem);font-weight:800;color:#8892a6;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-family:Orbitron,sans-serif}' +

  '.sequencia-salva-item{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.4);padding:12px 16px;border-radius:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.06);transition:all 0.3s}' +

  '.sequencia-salva-item:hover{border-color:rgba(0,229,160,0.25);transform:translateX(4px)}' +

  '.sequencia-salva-item .sequencia-nome{font-size:clamp(0.75rem,2vw,0.9rem);font-weight:800;color:#e0e6f0;font-family:Orbitron,sans-serif;letter-spacing:0.5px}' +

  '.sequencia-salva-item .sequencia-info{font-size:clamp(0.6rem,1.5vw,0.75rem);color:#7a8498;font-family:Orbitron,monospace;margin-top:4px;letter-spacing:0.5px}' +

  '.sequencia-salva-item .sequencia-acoes{display:flex;gap:8px}' +

  '.zona-z2{color:var(--accent-primary)!important}' +

  '@media (min-width: 768px){' +

    '.painel-seta{bottom:240px}' +

    '.hud-superior{top:16px}' +

  '}' +

  '@media (min-width: 1024px){' +

    '.app-wrapper{max-width:1050px}' +

    '.painel-controle{max-width:750px}' +

    '.hud-superior{max-width:750px}' +

  '}' +

  '@media (max-width: 400px){' +

    '.painel-seta{bottom:240px;width:58px;height:80px}' +

    '.painel-seta.esquerda{left:calc(50% - 78px)}' +

    '.painel-seta.direita{right:calc(50% - 78px)}' +

    '.grid-telemetria{gap:4px;padding:10px 4px}' +

    '.btn{min-width:75px;padding:9px 8px}' +

    '.etapa-item{grid-template-columns:1fr 80px 40px 36px;gap:6px;padding:8px}' +

  '}';

  document.head.appendChild(s);

})();

</script>

<div style="min-height:100vh;padding:clamp(12px,2.5vw,24px);box-sizing:border-box;position:relative;z-index:1;">

<div class="app-wrapper">

  <div id="canvas-container"></div>

  <div class="hud-superior">

    <div class="hud-linha-topo">

      <div class="treinador-fala-mini" id="falaTreinador">Sistema pronto. Selecione o tempo e a sequência.</div>

      <div class="fps-badge" id="fpsCounter">60 FPS</div>

    </div>

    <div class="espectro-zonas">

      <div class="bloco-zona" id="bz1" style="color:#4fc3f7;background:rgba(79,195,247,0.2)">Z1</div>

      <div class="bloco-zona" id="bz2" style="color:#00e5a0;background:rgba(0,229,160,0.2)">Z2</div>

      <div class="bloco-zona" id="bz3" style="color:#ffd54f;background:rgba(255,213,79,0.2)">Z3</div>

      <div class="bloco-zona" id="bz4" style="color:#ff5252;background:rgba(255,82,82,0.2)">Z4</div>

    </div>

  </div>

  <div class="painel-seta esquerda" id="setaEsqBox">

    <div class="seta-status" id="setaEsqStatus">CIMA</div>

  </div>

  <div class="painel-seta direita" id="setaDirBox">

    <div class="seta-rotulo">PE DIR</div>

    <div class="seta-icone" id="setaDirIcone" style="font-family:monospace;">▼</div>

    <div class="seta-status" id="setaDirStatus">BAIXO</div>

  </div>

  <div class="painel-controle" id="painelControle" style="margin-top:-150px;">

    <div class="painel-topo-info">

    <div class="seletor-sequencia">

    <div class="opcoes-tempo">

      <button class="botao-tempo" data-segundos="600">10 Min</button>

      <button class="botao-tempo" data-segundos="900">15 Min</button>

      <button class="botao-tempo" data-segundos="1200">20 Min</button>

      <button class="botao-tempo" data-segundos="1800">30 Min</button>

    <div class="grid-telemetria">

      <div class="dado-card"><span id="cal">0.0</span><label>Kcal</label></div>

      <div class="dado-card"><span id="km">0.00</span><label>Km</label></div>

      <div class="dado-card"><span id="vel">22.0</span><label>Km/h</label></div>

      <div class="dado-card"><span id="rpm">75</span><label>RPM</label></div>

    <div class="bloco-tempo-progresso">

      <div class="tempo-restante" id="tempo">00:00:00</div>

      <div class="barra-container">

        <div class="barra-progresso"><div class="progresso" id="barra"></div></div>

        <div class="sub-progresso-etapa" id="subProgressoEtapa">Etapa: 20s restantes</div>

      </div>

    </div>

    <div class="botoes-acao">

      <button class="btn iniciar" id="btnIniciar" disabled>Iniciar</button>

      <button class="btn parar" id="btnParar" disabled>Pausar</button>

      <button class="btn reiniciar" id="btnReiniciar" disabled>Reset</button>

      <button class="btn sequencia" id="btnSequencia">Sequências</button>

      <button class="btn tela-cheia" id="btnTela">Tela</button>

  <div class="modal">

    <div class="modal-titulo">

      <span>Gerenciar Sequências</span>

      <button class="modal-fechar" id="btnFecharModal">×</button>

    </div>

    <input type="text" class="input-nome-sequencia" id="nomeSequencia" placeholder="Nome da sequência (ex: Iniciante, Avançado...)">

    <div class="lista-etapas" id="listaEtapas">

      <!-- Etapas serão adicionadas dinamicamente -->

    </div>

    <button class="btn-adicionar-etapa" id="btnAdicionarEtapa">+ ADICIONAR ETAPA</button>

    <div class="modal-botoes">

      <button class="btn" style="background:linear-gradient(135deg,#455a64,#546e7a);color:#fff;box-shadow:0 2px 10px rgba(69,90,100,0.3);" id="btnLimparSequencia">LIMPAR</button>

      <button class="btn" style="background:linear-gradient(135deg,#00b386,#00e5a0);color:#fff;box-shadow:0 2px 10px rgba(0,179,134,0.4);" id="btnSalvarSequencia">SALVAR</button>

    </div>

    <div class="sequencias-salvas">

      <div class="sequencias-salvas-titulo">Sequências Salvas</div>

      <div id="listaSequenciasSalvas">

        <!-- Sequências salvas serão listadas aqui -->

      </div>

    </div>

  </div>

</div>

<script>

(function(){

  const cicloHIITPadrao = [

    { zona: 'z1', duracao: 20, fala: "Z1 Aquecimento ativado. Cadência forte para preparar." },

    { zona: 'z2', duracao: 20, fala: "Z2 Ritmo ativo. Mantenha movimento constante." },

    { zona: 'z3', duracao: 20, fala: "Z3 Limiar alto! Acelere os pés agora!" },

    { zona: 'z4', duracao: 20, fala: "Z4 SPRINT MÁXIMO! Força total por 20 segundos!" }

  ];

  let cicloHIIT = JSON.parse(JSON.stringify(cicloHIITPadrao));

  let sequenciasSalvas = {};

  const zonas = {

    z1: { nome: "Z1 Aquecimento", xPos: -3.0, vel: 22.0, rpm: 75, cor: "#4fc3f7", hex: 0x4fc3f7 },

    z2: { nome: "Z2 Ritmo Ativo", xPos: -1.0, vel: 30.0, rpm: 95, cor: "#00e5a0", hex: 0x00e5a0 },

    z3: { nome: "Z3 HIIT Intenso", xPos:  1.0, vel: 40.0, rpm: 115, cor: "#ffd54f", hex: 0xffd54f },

    z4: { nome: "Z4 SPRINT TOTAL", xPos:  3.0, vel: 52.0, rpm: 140, cor: "#ff5252", hex: 0xff5252 }

  };

  const frasesTreinador = {

    z1: "Z1 Aquecimento. Cadência leve para preparar o corpo.",

    z2: "Z2 Ritmo ativo. Mantenha movimento constante e respirando bem.",

    z3: "Z3 Intenso! Acelere os pés, aumente a cadência!",

    z4: "Z4 SPRINT MÁXIMO! Força total! Dê tudo de si!"

  };

  function falarTreinador(texto) {

    document.getElementById('falaTreinador').textContent = texto;

    if ('speechSynthesis' in window) {

      window.speechSynthesis.cancel();

      const fala = new SpeechSynthesisUtterance(texto);

      fala.lang = 'pt-BR';

      fala.rate = 1.15;

      const vozes = window.speechSynthesis.getVoices();

      const vozMasculina = vozes.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('google portugues do brasil') && !v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('antonio') || v.name.toLowerCase().includes('manoel')));

      if (vozMasculina) fala.voice = vozMasculina;

      else {

        const vozPt = vozes.find(v => v.lang.includes('pt'));

        if (vozPt) fala.voice = vozPt;

      }

      window.speechSynthesis.speak(fala);

    }

  }

  if ('speechSynthesis' in window) {

    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

  }

  function carregarSequenciasSalvas() {

    const salvas = localStorage.getItem('sequenciasTreino');

    if (salvas) {

      sequenciasSalvas = JSON.parse(salvas);

    }

    atualizarSeletorSequencias();

    atualizarListaSequenciasSalvas();

  }

  function salvarSequenciasNoStorage() {

    localStorage.setItem('sequenciasTreino', JSON.stringify(sequenciasSalvas));

  }

  function atualizarSeletorSequencias() {

    const seletor = document.getElementById('seletorSequencia');

    seletor.innerHTML = '<option value="padrao">Padrão HIIT (Z1→Z2→Z3→Z4) - 20s cada</option>';

    Object.keys(sequenciasSalvas).forEach(nome => {

      const seq = sequenciasSalvas[nome];

      const totalSegundos = seq.reduce((s, e) => s + e.duracao, 0);

      seletor.innerHTML += `<option value="${nome}">${nome} (${seq.length} etapas • ${totalSegundos}s/ciclo)</option>`;

    });

  }

  function atualizarInfoSequenciaAtual() {

    const info = document.getElementById('sequenciaAtualInfo');

    const totalSegundos = cicloHIIT.reduce((s, e) => s + e.duracao, 0);

    info.textContent = `${cicloHIIT.length} etapa${cicloHIIT.length > 1 ? 's' : ''} • ${totalSegundos}s por ciclo`;

  }

  const modal = document.getElementById('modalSequencias');

  const btnSequencia = document.getElementById('btnSequencia');

  const btnFecharModal = document.getElementById('btnFecharModal');

  const btnAdicionarEtapa = document.getElementById('btnAdicionarEtapa');

  const btnSalvarSequencia = document.getElementById('btnSalvarSequencia');

  const btnLimparSequencia = document.getElementById('btnLimparSequencia');

  const listaEtapas = document.getElementById('listaEtapas');

  const listaSequenciasSalvas = document.getElementById('listaSequenciasSalvas');

  const nomeSequenciaInput = document.getElementById('nomeSequencia');

  btnSequencia.addEventListener('click', () => {

    modal.classList.add('aberto');

    carregarEtapasNoModal();

  });

  btnFecharModal.addEventListener('click', () => {

    modal.classList.remove('aberto');

  });

  modal.addEventListener('click', (e) => {

    if (e.target === modal) modal.classList.remove('aberto');

  });

  function carregarEtapasNoModal() {

    listaEtapas.innerHTML = '';

    cicloHIIT.forEach(etapa => {

      adicionarItemEtapa(etapa.zona, etapa.duracao);

    });

    atualizarListaSequenciasSalvas();

  }

  function adicionarItemEtapa(zona = 'z1', duracao = 20) {

    const div = document.createElement('div');

    div.className = 'etapa-item';

    div.innerHTML = `

      <select class="zona-z${zona === 'z1' ? '1' : zona === 'z2' ? '2' : zona === 'z3' ? '3' : '4'}">

        <option value="z1" ${zona === 'z1' ? 'selected' : ''}>Z1 - Aquecimento (22 km/h)</option>

        <option value="z2" ${zona === 'z2' ? 'selected' : ''}>Z2 - Ritmo Ativo (30 km/h)</option>

        <option value="z3" ${zona === 'z3' ? 'selected' : ''}>Z3 - HIIT Intenso (40 km/h)</option>

        <option value="z4" ${zona === 'z4' ? 'selected' : ''}>Z4 - Sprint Total (52 km/h)</option>

      </select>

      <input type="number" value="${duracao}" min="5" max="300" placeholder="Segundos">

      <span style="font-size:clamp(0.65rem,1.6vw,0.8rem);color:#7a8498;font-family:Orbitron,monospace;">seg</span>

      <button class="btn-remover">×</button>

    `;

    const select = div.querySelector('select');

    select.addEventListener('change', () => {

      select.className = 'zona-' + select.value;

    });

    div.querySelector('.btn-remover').addEventListener('click', () => {

      div.remove();

    });

    listaEtapas.appendChild(div);

  }

  btnAdicionarEtapa.addEventListener('click', () => {

    adicionarItemEtapa('z1', 20);

  });

  btnLimparSequencia.addEventListener('click', () => {

    listaEtapas.innerHTML = '';

    nomeSequenciaInput.value = '';

  });

  btnSalvarSequencia.addEventListener('click', () => {

    const nome = nomeSequenciaInput.value.trim();

    if (!nome) {

      alert('Digite um nome para a sequência!');

      return;

    }

    const etapas = [];

    const itens = listaEtapas.querySelectorAll('.etapa-item');

    itens.forEach(item => {

      const zona = item.querySelector('select').value;

      const duracao = parseInt(item.querySelector('input').value) || 20;

      etapas.push({

        zona: zona,

        duracao: duracao,

        fala: frasesTreinador[zona]

      });

    });

    if (etapas.length === 0) {

      alert('Adicione pelo menos uma etapa!');

      return;

    }

    sequenciasSalvas[nome] = etapas;

    salvarSequenciasNoStorage();

    atualizarSeletorSequencias();

    atualizarListaSequenciasSalvas();

    alert('Sequência "' + nome + '" salva com sucesso!');

  });

  function atualizarListaSequenciasSalvas() {

    listaSequenciasSalvas.innerHTML = '';

    if (Object.keys(sequenciasSalvas).length === 0) {

      listaSequenciasSalvas.innerHTML = '<div style="font-size:clamp(0.7rem,1.8vw,0.85rem);color:#6b7589;text-align:center;padding:20px;border-radius:12px;background:rgba(0,0,0,0.3);border:1px dashed rgba(255,255,255,0.1);">Nenhuma sequência salva ainda.<br><span style="font-size:0.75rem;color:#5a6478;">Crie sua primeira sequência acima!</span></div>';

      return;

    }

    Object.keys(sequenciasSalvas).forEach(nome => {

      const seq = sequenciasSalvas[nome];

      const totalSegundos = seq.reduce((s, e) => s + e.duracao, 0);

      const div = document.createElement('div');

      div.className = 'sequencia-salva-item';

      div.innerHTML = `

        <div>

          <div class="sequencia-nome">${nome}</div>

          <div class="sequencia-info">${seq.length} etapa${seq.length > 1 ? 's' : ''} • ${totalSegundos}s • ${seq.map(e => e.zona.toUpperCase()).join(' → ')}</div>

        </div>

        <div class="sequencia-acoes">

          <button class="btn-seq usar" data-nome="${nome}">USAR</button>

          <button class="btn-seq excluir" data-nome="${nome}">EXCLUIR</button>

        </div>

      `;

      div.querySelector('.btn-seq.usar').addEventListener('click', () => {

        cicloHIIT = JSON.parse(JSON.stringify(sequenciasSalvas[nome]));

        document.getElementById('seletorSequencia').value = nome;

        atualizarInfoSequenciaAtual();

        alert('Sequência "' + nome + '" selecionada!');

        modal.classList.remove('aberto');

      });

      div.querySelector('.btn-seq.excluir').addEventListener('click', () => {

        if (confirm('Excluir a sequência "' + nome + '"?')) {

          delete sequenciasSalvas[nome];

          salvarSequenciasNoStorage();

          atualizarSeletorSequencias();

          atualizarListaSequenciasSalvas();

        }

      });

      listaSequenciasSalvas.appendChild(div);

    });

  }

  document.getElementById('seletorSequencia').addEventListener('change', (e) => {

    if (e.target.value === 'padrao') {

      cicloHIIT = JSON.parse(JSON.stringify(cicloHIITPadrao));

    } else if (sequenciasSalvas[e.target.value]) {

      cicloHIIT = JSON.parse(JSON.stringify(sequenciasSalvas[e.target.value]));

    }

    atualizarInfoSequenciaAtual();

  });

  // ============ CANVAS 3D ============

  const container = document.getElementById('canvas-container');

  function calcularAlturaCanvas() {

    const largura = container.clientWidth;

    if (largura < 500) {

      return Math.max(520, largura * 1.15);

    } else if (largura < 800) {

      return largura * 0.95;

    } else {

      return Math.min(680, largura * 0.68);

    }

  }

  container.style.height = calcularAlturaCanvas() + 'px';

  const scene = new THREE.Scene();

  scene.fog = new THREE.FogExp2(0x0a0e17, 0.03);

  const camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.1, 1000);

  camera.position.set(zonas.z1.xPos, 1.25, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });

  renderer.setSize(container.clientWidth, container.clientHeight);

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  container.appendChild(renderer.domElement);

  // ILUMINAÇÃO MELHORADA

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);

  scene.add(ambientLight);

  const headlight = new THREE.SpotLight(0xffffff, 4, 60, Math.PI / 3, 0.35);

  headlight.position.set(0, 1.2, -0.1);

  headlight.target.position.set(0, 0, -30);

  scene.add(headlight); scene.add(headlight.target);

  // Luz de preenchimento lateral

  const fillLight = new THREE.DirectionalLight(0x4fc3f7, 0.15);

  fillLight.position.set(-5, 3, -5);

  scene.add(fillLight);

  const povGroup = new THREE.Group();

  scene.add(povGroup);

  povGroup.position.x = zonas.z1.xPos;

  const matHandle = new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.35, metalness: 0.85 });

  const matGrip = new THREE.MeshStandardMaterial({ color: 0x2a2a35, roughness: 0.85 });

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3), matHandle);

  stem.rotation.x = Math.PI / 3; stem.position.set(0, 0.85, -0.4); povGroup.add(stem);

  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.75), matHandle);

  bar.rotation.z = Math.PI / 2; bar.position.set(0, 0.95, -0.5); povGroup.add(bar);

  const gripL = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);

  gripL.rotation.z = Math.PI / 2; gripL.position.set(0.32, 0.95, -0.5); povGroup.add(gripL);

  const gripR = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15), matGrip);

  gripR.rotation.z = Math.PI / 2; gripR.position.set(-0.32, 0.95, -0.5); povGroup.add(gripR);

  const displayMat = new THREE.MeshBasicMaterial({ color: zonas.z1.hex });

  const display = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.09, 0.02), displayMat);

  display.position.set(0, 1.0, -0.48); display.rotation.x = -Math.PI / 6; povGroup.add(display);

  // PISTA COM TEXTURA MELHORADA

  const roadMat = new THREE.MeshStandardMaterial({ color: 0x0d111a, roughness: 0.75 });

  const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 250), roadMat);

  road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -110); scene.add(road);

  // Faixas laterais brancas

  const faixaLateralMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  [-5.8, 5.8].forEach(posX => {

    const faixa = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 250), faixaLateralMat);

    faixa.rotation.x = -Math.PI / 2;

    faixa.position.set(posX, 0.006, -110);

    scene.add(faixa);

  });

  Object.keys(zonas).forEach(k => {

    const z = zonas[k];

    const faixaMat = new THREE.MeshBasicMaterial({ color: z.hex });

    const faixa = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 250), faixaMat);

    faixa.rotation.x = -Math.PI / 2;

    faixa.position.set(z.xPos, 0.005, -110);

    scene.add(faixa);

  });

  const trackLines = [];

  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });

  const divisorX = [-2.2, 0.0, 2.2];

  

  for (let i = 0; i < 25; i++) {

    divisorX.forEach(posX => {

      const line = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.01, 3), lineMat);

      line.position.set(posX, 0.01, -i * 10); 

      scene.add(line); 

      trackLines.push(line);

    });

  }

  // ============ CONTROLES E LÓGICA ============

  const botoesTempo = document.querySelectorAll('.botao-tempo');

  const painelControle = document.getElementById('painelControle');

  const indicadorFaixa = document.getElementById('indicadorFaixa');

  const tempoEl = document.getElementById('tempo');

  const btnIniciar = document.getElementById('btnIniciar');

  const btnParar = document.getElementById('btnParar');

  const btnReiniciar = document.getElementById('btnReiniciar');

  const btnTela = document.getElementById('btnTela');

  const barra = document.getElementById('barra');

  const subProgressoEtapa = document.getElementById('subProgressoEtapa');

  const elCal = document.getElementById('cal');

  const elKm = document.getElementById('km');

  const elVel = document.getElementById('vel');

  const elRpm = document.getElementById('rpm');

  const fpsCounter = document.getElementById('fpsCounter');

  const setaEsqBox = document.getElementById('setaEsqBox');

  const setaDirBox = document.getElementById('setaDirBox');

  const setaEsqIcone = document.getElementById('setaEsqIcone');

  const setaDirIcone = document.getElementById('setaDirIcone');

  const setaEsqStatus = document.getElementById('setaEsqStatus');

  const setaDirStatus = document.getElementById('setaDirStatus');

  let tempoTotal = 0, tempoRestante = 0;

  let cronometro = null, treinoAtivo = false;

  let calorias = 0, distancia = 0;

  

  let indiceEtapaHIIT = 0;

  let tempoSegundosEtapa = 0;

  let zonaChaveAtual = 'z1';

  let xAlvoCamera = zonas.z1.xPos;

  botoesTempo.forEach(btn => {

    btn.addEventListener('click', () => {

      botoesTempo.forEach(b => b.classList.remove('selecionado'));

      btn.classList.add('selecionado');

      tempoTotal = parseInt(btn.dataset.segundos);

      tempoRestante = tempoTotal;

      atualizaTela();

      btnIniciar.disabled = false;

    });

  });

  function atualizarBlocosEspectro(zonaAtiva) {

    ['z1', 'z2', 'z3', 'z4'].forEach(z => {

      const el = document.getElementById('b' + z);

      if (z === zonaAtiva) el.classList.add('ativo');

      else el.classList.remove('ativo');

    });

  }

  function aplicarEtapaHIIT(etapaIndex) {

    const etapa = cicloHIIT[etapaIndex];

    zonaChaveAtual = etapa.zona;

    tempoSegundosEtapa = 0;

    

    const z = zonas[zonaChaveAtual];

    xAlvoCamera = z.xPos;

    painelControle.style.borderColor = z.cor;

    tempoEl.style.color = z.cor;

    barra.style.background = `linear-gradient(90deg,${z.cor},${z.cor}dd)`;

    barra.style.boxShadow = `0 0 15px ${z.cor}`;

    indicadorFaixa.textContent = z.nome;

    indicadorFaixa.style.color = z.cor;

    document.querySelectorAll('.dado-card span').forEach(el => el.style.color = z.cor);

    displayMat.color.set(z.hex);

    atualizarBlocosEspectro(zonaChaveAtual);

    falarTreinador(etapa.fala);

  }

  function formatarTempo(s) {

    const h = Math.floor(s / 3600).toString().padStart(2, '0');

    const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');

    const seg = (s % 60).toString().padStart(2, '0');

    return `${h}:${m}:${seg}`;

  }

  function atualizaTela() {

    const z = zonas[zonaChaveAtual];

    tempoEl.textContent = formatarTempo(tempoRestante);

    barra.style.width = `${tempoTotal > 0 ? ((tempoTotal - tempoRestante) / tempoTotal) * 100 : 0}%`;

    

    const etapaAtual = cicloHIIT[indiceEtapaHIIT];

    const restanteEtapa = etapaAtual.duracao - tempoSegundosEtapa;

    subProgressoEtapa.textContent = `Etapa (${etapaAtual.zona.toUpperCase()}): ${restanteEtapa}s`;

    elCal.textContent = calorias.toFixed(1);

    elKm.textContent = distancia.toFixed(2);

    elVel.textContent = z.vel.toFixed(1);

  }

  btnIniciar.addEventListener('click', () => {

    if(tempoRestante <= 0) return;

    treinoAtivo = true;

    if(cronometro) clearInterval(cronometro);

    

    aplicarEtapaHIIT(indiceEtapaHIIT);

    cronometro = setInterval(() => {

      tempoRestante--;

      tempoSegundosEtapa++;

      const etapaAtual = cicloHIIT[indiceEtapaHIIT];

      if (tempoSegundosEtapa >= etapaAtual.duracao && tempoRestante > 0) {

        indiceEtapaHIIT = (indiceEtapaHIIT + 1) % cicloHIIT.length;

        aplicarEtapaHIIT(indiceEtapaHIIT);

      }

      const z = zonas[zonaChaveAtual];

      calorias += (18 * (z.vel / 15)) / 60;

      distancia += z.vel / 3600;

      elRpm.textContent = Math.round(z.rpm + Math.sin(tempoRestante / 2) * 4);

      atualizaTela();

      if (tempoRestante <= 0) {

        clearInterval(cronometro);

        treinoAtivo = false;

        falarTreinador("Treino concluído com sucesso! Excelente desempenho!");

        btnIniciar.disabled = btnParar.disabled = true;

      }

    }, 1000);

    

    btnIniciar.disabled = true;

    btnParar.disabled = false;

    btnReiniciar.disabled = false;

  });

  btnParar.addEventListener('click', () => {

    if (treinoAtivo) {

      clearInterval(cronometro);

      treinoAtivo = false;

      btnParar.textContent = "Continuar";

      falarTreinador("Treino pausado.");

    } else {

      btnIniciar.click();

      btnParar.textContent = "Pausar";

    }

  });

  btnReiniciar.addEventListener('click', () => {

    clearInterval(cronometro);

    tempoRestante = tempoTotal;

    indiceEtapaHIIT = 0;

    tempoSegundosEtapa = 0;

    calorias = 0; distancia = 0;

    treinoAtivo = false;

    aplicarEtapaHIIT(0);

    atualizaTela();

    falarTreinador("Treino reiniciado!");

    btnIniciar.disabled = false;

    btnParar.disabled = true;

    btnReiniciar.disabled = true;

    btnParar.textContent = "Pausar";

  });

  btnTela.addEventListener('click', () => {

    if (!document.fullscreenElement) document.documentElement.requestFullscreen();

    else document.exitFullscreen();

  });

  let step = 0;

  let lastTime = performance.now();

  let frameCount = 0;

  function animate(currentTime) {

    requestAnimationFrame(animate);

    frameCount++;

    if (currentTime - lastTime >= 1000) {

      fpsCounter.textContent = `${frameCount} FPS`;

      frameCount = 0;

      lastTime = currentTime;

    }

    camera.position.x += (xAlvoCamera - camera.position.x) * 0.12;

    povGroup.position.x = camera.position.x;

    if (treinoAtivo) {

      const z = zonas[zonaChaveAtual];

      step += 0.07 * (z.rpm / 60);

      const speed = z.vel / 60;

      trackLines.forEach(line => {

        line.position.z += speed;

        if (line.position.z > 5) line.position.z = -245;

      });

      camera.position.y = 1.25 + Math.sin(step * 2) * 0.015;

      povGroup.position.y = Math.sin(step * 2) * 0.008;

      povGroup.rotation.z = Math.sin(step) * 0.05;

      povGroup.rotation.y = Math.cos(step) * 0.02;

      const alternanciaPedal = Math.sin(step);

      if (alternanciaPedal > 0) {

        setaEsqBox.className = "painel-seta esquerda ativo-cima";

        setaEsqIcone.textContent = "▲";

        setaEsqStatus.textContent = "CIMA";

        setaDirBox.className = "painel-seta direita ativo-baixo";

        setaDirIcone.textContent = "▼";

        setaDirStatus.textContent = "BAIXO";

      } else {

        setaEsqBox.className = "painel-seta esquerda ativo-baixo";

        setaEsqIcone.textContent = "▼";

        setaEsqStatus.textContent = "BAIXO";

        setaDirBox.className = "painel-seta direita ativo-cima";

        setaDirIcone.textContent = "▲";

        setaDirStatus.textContent = "CIMA";

      }

    } else {

      povGroup.rotation.z *= 0.92;

      povGroup.rotation.y *= 0.92;

    }

    renderer.render(scene, camera);

  }

  let timeoutResize;

  window.addEventListener('resize', () => {

    clearTimeout(timeoutResize);

    timeoutResize = setTimeout(() => {

      const novaAltura = calcularAlturaCanvas();

      container.style.height = novaAltura + 'px';

      camera.aspect = container.clientWidth / container.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(container.clientWidth, container.clientHeight);

    }, 100);

  });

  carregarSequenciasSalvas();

  atualizarInfoSequenciaAtual();

  requestAnimationFrame(animate);

})();

</script>

</html>
